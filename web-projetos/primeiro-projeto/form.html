<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Formulário</h1>
    <form>
        <label for="name">Nome:</label>
        <input type="text" id="name" placeholder="Digite o seu nome" required>

        <br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Digite o seu email" required>

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite a sua senha" required>

        <br><br>

        <h2>Animal de estimação</h2>

        <input type="radio" id="dog" name="animal" value="Cachorro">
        <label for="dog">Cachorro</label>

        <br><br>

        <input type="radio" id="cat" name="animal" value="Gato">
        <label for="cat">Gato</label>

        <br><br>

        <input type="radio" id="buuny" name="animal" value="Coelho">
        <label for="bunny">Coelho</label>

        <br><br>

        <h2>O que você tem em casa?</h2>

        <br><br>
        <input type="checkbox" id="item1" name="item1" value="TV">
        <label for="item1">TV</label>

        <br><br>

        <input type="checkbox" id="item2" name="item2" value="PC">
        <label for="item2">PC</label>

        <br><br>

        <input type="checkbox" id="item3" name="item3" value="Impressora">
        <label for="item3">Impressora</label>

        <br><br>
        <h2>Escolha uma cor:</h2>

        <select name="cores">
            <option selected disabled value="">Selecione uma cor</option>
            <option value="vermelho">Vermelho</option>
            <option value="azul">Azul</option>
            <option value="amarelo">Amarelo</option>
        </select>

        <br><br>

        <h2>Digite uma mensagem</h2><br>
        <textarea placeholder="Digite sua mensagem"></textarea>

        <br><br><br>

        <input type="submit" value="Enviar formulário">

    </form>

    <br><br><hr>
    <a href="index.html">Voltar À página principal</a>
</body>
</html>
